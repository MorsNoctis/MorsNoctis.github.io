      body {
        margin: 0;
        font-family: "Roboto", sans-serif;
        font-weight: 400;

        background-image: url("img/background.png");
        background-repeat: no-repeat;
        height: 1290px;
  background-position: center;
  background-size:cover;
  background-color: #000000;

      .container {
        display: flow-root;
        background-color: none;
        position: absolute;
        top: 460px;
        left: 40%;
        font-size: 24px;
        line-height: 4.3vh;
        width: 400px;
        height: 85vh;
        align-items: center;
        justify-content: center;
        animation: bganimation 0.5s;
      }
      @keyframes bganimation {
  0%{
    opacity: 0;
    transform: scale(0%, 0%);
  }
  100% {
		opacity: 1;
		transform: scale(100%, 100%);
	}
}
      .Spoti-link {
        display: flow-root;
        padding: 2px;
        border-radius: 8px;
        box-shadow: 5px 2px 15px rgba(0, 0, 0, 0.8);
        color: rgb(255, 255, 255);
        text-decoration: none;
        text-shadow: 3px 3px rgba(0, 0, 0, 0.8);
        margin-left: 10px;
        text-align: center;
      }
      .logo {
        position: absolute;
        left: 35px;
        top: -100px;
        width: 85%;
        height: 12%;
      }
      .Spoti-link:hover {
        text-decoration: underline;
        transition: 250ms;
        &:hover {
          scale: 1.1;
          background: radial-gradient(circle at center, #a252fd, #4200ad);
          opacity: 1;
        }
        &:active {
          scale: 0.9;
        }
      }
      .Headfont {
        position: absolute;
        top: -460px;
        left: 8%;
        color: white;
        text-shadow: 3px 3px rgba(0, 0, 0, 0.8);
        display: flow-root;
        height: auto;
      }
      
      .profile {
        position: absolute;
        left: 8%;
        top: 70%;
        width: 80%;
        object-fit: cover;
      }
      /* For desktop: */
      .col-1 {
        width: 8.33%;
      }
      .col-2 {

      }
      .col-3 {
        width: 25%;
      }
      .col-4 {

      }
      .col-5 {

      }

      .col-10 {
        width: 83.33%;
      }
      .col-11 {
        width: 91.66%;
      }
      .col-12 {
        width: 100%;
      }

      @media only screen and (min-width: 600px) {
        /* For tablets: */
        .col-s-1 {
          width: 8.33%;
        }
        .col-s-2 {
          width: 16.66%;
        }
        .col-s-3 {
          width: 25%;
        }
        .col-s-4 {

        }
        .col-s-5 {

        .col-s-6 {

        .col-s-9 {

        }
        .col-s-10 {
          width: 83.33%;
        }
        .col-s-11 {
          width: 91.66%;
        }
        .col-s-12 {
          width: 100%;
        }
      }

      @media only screen and (max-width: 768px) {
        /* For mobile phones: */
        [class*="col-"] {
          width: 100%;
        }
        .container {
          display: flow-root;
          position: absolute;
          left: 7%;
        }
        .Headfont {
          position: absolute;
          left: 7%;
        }
        .logo {
          position: absolute;
          left: 17%;
        }
        .profile {
          position: absolute;
          left: 10%;
        }
      }
      
    </style>

  <body>
    <audio id="background-music" autoplay loop>
      <source src="musik.mp3" type="audio/mpeg">
  </audio>

    <button id="play-music">Musik starten</button>
    <button id="stop-music">Musik stoppen</button>
<input type="range" id="volume-control" min="0" max="1" step="0.01" value="1">
    <script>
    document.addEventListener("DOMContentLoaded", function () {
            const audio = document.getElementById("background-music");
            const playButton = document.getElementById("play-music");
            const stopButton = document.getElementById("stop-music");
            const volumeControl = document.getElementById("volume-control");
            
            playButton.addEventListener("click", function () {
                audio.muted = false; // Stummschaltung aufheben
                audio.play().catch(error => {
                    console.log("Autoplay wurde blockiert: " + error);
                });
            });

            stopButton.addEventListener("click", function () {
                audio.pause(); // Musik anhalten
                audio.currentTime = 0; // Zurück zum Anfang
            });
            
            volumeControl.addEventListener("input", function () {
                audio.volume = this.value;
            });
        });
  </script>
